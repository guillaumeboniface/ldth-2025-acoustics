version: '3.8'

services:
  react-app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"
    volumes:
      - ./react-app:/app
      - /app/node_modules
      - ./tiny_mel_classifier.onnx:/app/public/tiny_mel_classifier.onnx:ro
    environment:
      - NODE_ENV=development